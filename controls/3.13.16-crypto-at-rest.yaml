apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-800-171-3.13.16
  name: crypto-at-rest
  title: Protect the confidentiality of CUI at rest
  framework: nist-800-171
  category: System and Communications Protection (3.13)
  severity: critical
  tags:
    - cryptography
    - encryption-at-rest
    - s3
  owners:
    - team: security

spec:
  description: |
    NIST SP 800-171 Rev 2 §3.13.16 requires protection of CUI
    confidentiality at rest. In AWS this maps to default server-side
    encryption on every bucket storing CUI. Concord rejects any
    bucket without `encryption.configured = true`.

  rationale: |
    Vendored from CIS AWS 2.1.1. Reuses the same evidence as §3.4.1
    but evaluated against the confidentiality-of-CUI framing. The
    warn-level rules (prefer KMS over AES256, enable bucket-key)
    nudge toward stronger key management without blocking.

  evidence:
    - id: s3_buckets
      source: aws
      type: s3_bucket_encryption
      fixture: ../tests/fixtures/s3-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.cis_aws.s3_encryption
    file: ../policies/s3_encryption.rego

  mappings:
    nist_800_171:
      - "3.13.16"
    nist_800_53:
      - "SC-28"
      - "SC-28(1)"
    cis_aws_v2:
      - "2.1.1"
    cmmc:
      - "SC.L2-3.13.16"

  status: stable
  blocking: true
