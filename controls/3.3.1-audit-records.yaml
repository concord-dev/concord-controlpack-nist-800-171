apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-800-171-3.3.1
  name: audit-records
  title: Create and retain system audit records
  framework: nist-800-171
  category: Audit and Accountability (3.3)
  severity: critical
  tags:
    - audit
    - logging
    - cloudtrail
  owners:
    - team: security

spec:
  description: |
    NIST SP 800-171 Rev 2 §3.3.1 requires the organization to create
    and retain system audit logs to the extent needed to enable
    monitoring, investigation, and reporting of unlawful or
    unauthorized activity. In an AWS environment this maps to a
    multi-region CloudTrail trail that is currently logging with
    log-file integrity validation enabled.

  rationale: |
    Vendored from CIS AWS 3.1. The qualifying-trail predicate
    (multi-region + logging + log_file_validation_enabled) satisfies
    both §3.3.1 (creation) and §3.3.8 (protection from unauthorised
    modification) because file-integrity validation is on.

  evidence:
    - id: cloudtrail
      source: aws
      type: cloudtrail_trails
      fixture: ../tests/fixtures/cloudtrail-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.cis_aws.cloudtrail_multi_region
    file: ../policies/cloudtrail.rego

  mappings:
    nist_800_171:
      - "3.3.1"
      - "3.3.2"
      - "3.3.8"
    nist_800_53:
      - "AU-2"
      - "AU-6"
      - "AU-9"
    cis_aws_v2:
      - "3.1"
    cmmc:
      - "AU.L2-3.3.1"
      - "AU.L2-3.3.2"
      - "AU.L2-3.3.8"

  status: stable
  blocking: true
