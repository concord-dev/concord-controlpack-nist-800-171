apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-800-171-3.4.1
  name: baseline-configuration
  title: Establish and maintain baseline configurations for organizational systems
  framework: nist-800-171
  category: Configuration Management (3.4)
  severity: high
  tags:
    - configuration
    - baseline
    - s3
  owners:
    - team: security

spec:
  description: |
    NIST SP 800-171 Rev 2 §3.4.1 requires the organization to establish
    and maintain baseline configurations and inventories. In an AWS
    environment, a meaningful baseline is that every S3 bucket has
    default encryption configured — drift from this default is the
    canonical configuration-baseline violation Concord detects.

  rationale: |
    Vendored from CIS AWS 2.1.1. Reuses the same evidence the §3.13.16
    crypto-at-rest control consumes, but evaluated against the
    baseline-configuration policy framing.

  evidence:
    - id: s3_buckets
      source: aws
      type: s3_bucket_encryption
      fixture: ../tests/fixtures/s3-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.cis_aws.s3_encryption
    file: ../policies/s3_encryption.rego

  mappings:
    nist_800_171:
      - "3.4.1"
      - "3.4.2"
    nist_800_53:
      - "CM-2"
      - "CM-6"
    cis_aws_v2:
      - "2.1.1"
    cmmc:
      - "CM.L2-3.4.1"
      - "CM.L2-3.4.2"

  status: stable
  blocking: true
