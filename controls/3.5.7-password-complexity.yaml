apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-800-171-3.5.7
  name: password-complexity
  title: Enforce a minimum password complexity and change of characters when new passwords are created
  framework: nist-800-171
  category: Identification and Authentication (3.5)
  severity: high
  tags:
    - identity
    - password-policy
  owners:
    - team: security

spec:
  description: |
    NIST SP 800-171 Rev 2 §3.5.7 requires enforcement of minimum
    password complexity and reuse-prevention. Concord evaluates the
    IAM account password policy and rejects accounts where the policy
    is missing or below the configured floor (length, all four
    character classes, max age, reuse prevention).

  rationale: |
    Vendored from CIS AWS 1.16. Default thresholds — length >= 14,
    max_age <= 90 days, reuse_prevention >= 24 — meet or exceed the
    NIST 800-171 floor. Override via spec.controls.params for tighter
    environments.

  evidence:
    - id: password_policy
      source: aws
      type: iam_password_policy
      fixture: ../tests/fixtures/iam-password-policy-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.cis_aws.iam_password_policy
    file: ../policies/iam_password_policy.rego

  mappings:
    nist_800_171:
      - "3.5.7"
      - "3.5.8"
    nist_800_53:
      - "IA-5"
    cis_aws_v2:
      - "1.16"
    cmmc:
      - "IA.L2-3.5.7"
      - "IA.L2-3.5.8"

  status: stable
  blocking: true
