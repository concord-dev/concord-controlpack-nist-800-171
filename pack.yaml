apiVersion: concord.dev/v1
kind: ControlPack
metadata:
  id: nist-800-171
  name: nist-800-171
  version: v0.1.0
  framework_label: NIST SP 800-171 Rev 2
  attribution:
    sources:
      - name: concord-dev/concord-controlpack-soc2
        url: https://github.com/concord-dev/concord-controlpack-soc2
        license: Apache-2.0
        notes: |
          3.1.1, 3.1.5, 3.5.3 vendor cc6_1.rego + cc6_2.rego (Okta MFA +
          access-review evidence). One ceremony, multiple frameworks
          satisfied — the SOC 2 / NIST 800-171 crosswalk dividend.
      - name: concord-dev/concord-controlpack-cis-aws
        url: https://github.com/concord-dev/concord-controlpack-cis-aws
        license: Apache-2.0
        notes: |
          3.3.1 (cloudtrail.rego), 3.5.7 (iam_password_policy.rego),
          3.4.1 / 3.13.16 (s3_encryption.rego) all derive from
          CIS AWS Foundations Benchmark v2.
      - name: prowler-cloud/prowler
        url: https://github.com/prowler-cloud/prowler
        license: Apache-2.0
        notes: |
          Underlying check logic for IAM password policy, CloudTrail
          multi-region, and S3 default encryption is implemented in
          Go inside concord-plugin-aws and matches the prowler checks
          iam_password_policy_*, cloudtrail_multi_region_enabled, and
          s3_bucket_default_encryption respectively.
      - name: usnistgov/oscal-content
        url: https://github.com/usnistgov/oscal-content
        license: Public domain
        notes: |
          Control IDs, titles, and family numbering follow NIST
          SP 800-171 Rev 2 (https://csrc.nist.gov/publications/detail/sp/800-171/rev-2/final)
          and the OSCAL profile.
spec:
  controls:
    - NIST-800-171-3.1.1
    - NIST-800-171-3.1.5
    - NIST-800-171-3.3.1
    - NIST-800-171-3.4.1
    - NIST-800-171-3.5.3
    - NIST-800-171-3.5.7
    - NIST-800-171-3.13.8
    - NIST-800-171-3.13.16
  evidence_sources:
    - source: aws
      version: ">=v0.1.0,<v1.0.0"
    - source: okta
      version: ">=v0.1.0,<v1.0.0"
    - source: github
      version: ">=v0.1.0,<v1.0.0"
    - source: cloudflare
      version: ">=v0.1.0,<v1.0.0"
